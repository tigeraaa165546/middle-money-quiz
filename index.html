    b:"你不是没本事，是本事一直整包卖。以前卖给一家公司，一个月一次；现在要拆开卖：一次上门、一次救急、一次代做、一次陪跑。整包卖得有人给你一个岗位，单片卖只要有人当下有麻烦。",
    s:"把你最拿手的事列三条，每条写清谁能用、什么场景、多少钱一次。这周找三个人，主动说「这事我能做，多少钱」，别等人来问。",
    w:"别一上来就做课程、做品牌。先收到第一笔上门的钱，再谈规模。中年起步最怕「仪式感比收入先到」。"},

    s:"挑五个还联系得上的老同事老客户，一个个发：我现在自己出来做了，你那边有需要随时喊我。别群发，别求职口气。",

  ["不摆，但能帮人张罗、找位置","H"],
  ["先算租金、原料、人工，算清再动","J"]],
 ["你最愿意接的活是：",
  ["一次一结，当场给钱","G"],
  ["一个月一结，稳定","J"],
  ["干完这单能带来下一单","B"],
  ["干完能攒成案例，以后好卖","A"]],
 ["别人说你「不像干这个的」，你：",
  ["有点不服，做给他看","E"],
  ["无所谓，能收钱就行","G"],
  ["正好，这就是我的差异点","D"],
  ["那我去小区里找点实在的活","C"]],
 ["让你去跑外卖、开网约车，你的想法：",
  ["能干，先把现金流接上","G"],
  ["能干，但只能当过渡","J"],
  ["干不了，身体吃不消","A"],
  ["我不跑，但我能帮人介绍、排班","H"]],
 ["你有一门别人不会的手艺，但没客人：",
  ["去小区里免费做三单，让人看见","C"],
  ["拍成短视频，讲清这东西值在哪","D"],
  ["找装修队、门店谈合作，让他们带单","B"],
  ["先去平台挂单，攒评价","F"]],
 ["孩子、老人那头的开销，现在：",
  ["一分不能减，只能往上挣","G"],
  ["已经在削了，能省则省","J"],
  ["让另一半先扛，我这边轻装上阵","I"],
  ["家里支持我先在网上接点单试试","F"]],
 ["一件事做三个月还没见钱，你：",
  ["停，换下一个","I"],
  ["再撑三个月，方向没错","J"],
  ["换个卖法，看能不能救","E"],
  ["把过程写出来发出去，先攒人","D"]],
 ["你最想甩掉的东西是：",
  ["那身「我以前是 XX 总」的壳","E"],
  ["对稳定工资的依赖","I"],
  ["什么都想自己扛的习惯","B"],
  ["对失败的怕","G"]],
 ["现在给你三个选择，你选：",
  ["一份工资不高但稳定的岗","J"],
  ["一个能自己定价的小生意","E"],
  ["一个按单结算的平台账号","F"],
  ["一个靠人脉撮合的机会","B"]],
 ["用一个词形容你现在的状态：",
  ["憋着","E"],
  ["算着","J"],
  ["试着","I"],
  ["扛着","G"]]
];

let idx = 0, score = {};
const $ = id => document.getElementById(id);

function start(){
  idx = 0; score = {};
  $("home").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}
function render(){
  const q = QS[idx];
  $("qnum").textContent = "第 " + (idx+1) + " 题";
  $("qtext").textContent = q[0];
  $("cnow").textContent = idx+1;
  $("pbar").style.width = (idx/32*100) + "%";
  const box = $("opts"); box.innerHTML = "";
  q.slice(1).forEach(([text,key])=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = text;
    b.onclick = ()=>pick(key);
    box.appendChild(b);
  });
  window.scrollTo(0,0);
}
function pick(key){
  score[key] = (score[key]||0) + 1;
  idx++;
  if(idx < QS.length) render(); else show();
}
function show(){
  $("quiz").classList.add("hidden");
  $("res").classList.remove("hidden");
  const order = ["A","B","C","D","E","F","G","H","I","J"];
  let best = order[0];
  order.forEach(k=>{ if((score[k]||0) > (score[best]||0)) best = k; });
  const t = TYPES[best];
  $("remoji").textContent = t.e;
  $("rname").textContent = t.n;
  $("rtag").textContent = "—— " + t.t + " ——";
  $("rbody").textContent = t.b;
  $("rstep").textContent = t.s;
  $("rwarn").textContent = t.w;
  const sorted = order.map(k=>[k,score[k]||0]).sort((a,b)=>b[1]-a[1]);
  const second = TYPES[sorted[1][0]];
  $("rstat").textContent = "次高方向：" + second.n + "（" + second.t + "）· 32 题答完，"
    + (score[best]||0) + " 题指向这个方向。两条路并不冲突，很多人是「先走一条兜底，再养第二条」。";
  $("res").dataset.text = "我在「中年失业后，你的下一个来钱方向」里测出了【" + t.n + "】："
    + t.t + "。" + t.s + " 来测测你的方向 →";
  window.scrollTo(0,0);
}
function copyRes(){
  const text = $("res").dataset.text;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert("已复制，去评论区报方向吧 👀"));
  }else{
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    alert("已复制，去评论区报方向吧 👀");
  }
}
</script>
